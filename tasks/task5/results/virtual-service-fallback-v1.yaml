apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: booking-service
spec:
  hosts:
    - "*"
  gateways:
    - booking-service-gateway
  http:
    # фича-флаг: если заголовок X-Feature-Enabled = true, то роутим на v2
    - match:
        - headers:
            x-feature-enabled:
              exact: "true"
      route:
        - destination:
            host: booking-service
            subset: v2

    # иначе если не сматчили выше, то делим трафик так 90/10 + retry
    - route:
        - destination:
            host: booking-service
            subset: v1
          weight: 0
        - destination:
            host: booking-service
            subset: v2
          weight: 100
      retries:
        attempts: 3
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure,refused-stream