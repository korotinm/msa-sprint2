stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service
  RELEASE: booking-service
  VALUES: ./helm/booking-service/staging-values.yaml

build:
  stage: build
  script:
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" ./booking-service

test:
  stage: test
  script:
    - docker rm -f bs-ci-test 2>/dev/null || true
    - docker run -d --name bs-ci-test "$IMAGE_NAME:$IMAGE_TAG"
    - sleep 2
    - docker exec bs-ci-test curl -sf http://localhost:8080/ping | grep -q pong
    - docker rm -f bs-ci-test

deploy:
  stage: deploy
  script:
    - minikube image load "$IMAGE_NAME:$IMAGE_TAG"
    - helm upgrade --install "$RELEASE" ./helm/booking-service -f "$VALUES"
    - kubectl rollout status deployment/"$RELEASE" --timeout=90s

tag:
  stage: tag
  script:
    - TAG="deploy-$(date +%Y%m%d-%H%M%S)"
    - git tag "$TAG"
    - echo "created tag $TAG"
