name: PlantUML Diagrams

on:
  push:
    branches:
      - '**'
    paths:
      - '**/*.puml'
      - '.github/workflows/plantuml.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plantuml-${{ github.ref }}
  cancel-in-progress: true

env:
  # C4-PlantUML requires PlantUML >= 1.2021 (%function_exists, %breakline).
  PLANTUML_VERSION: '1.2024.8'

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Download PlantUML
        run: |
          curl -fsSL -o plantuml.jar \
            "https://repo1.maven.org/maven2/net/sourceforge/plantuml/plantuml/${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          java -jar plantuml.jar -version

      - name: Generate Diagrams
        run: |
          # Diagrams live next to the task they belong to (Task1/, Task3/, ...),
          # so collect every .puml in the repo instead of a fixed diagrams/ tree.
          find . -type f -name '*.puml' -not -path './.git/*' -print0 | sort -z > puml.list
          if [ ! -s puml.list ]; then
            echo "No .puml files found."
            exit 0
          fi
          echo "Rendering:"
          tr '\0' '\n' < puml.list
          # -charset UTF-8: диаграммы содержат кириллицу.
          xargs -0 java -jar plantuml.jar -tpng -failfast2 -charset UTF-8 < puml.list
          rm -f puml.list

      - name: Upload Diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: '**/*.png'
          if-no-files-found: warn

      - name: Commit Diagrams
        if: github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A -- '*.png'
          if git diff --cached --quiet; then
            echo "No diagram changes to commit."
            exit 0
          fi
          git commit -m "Automated diagram generation [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
